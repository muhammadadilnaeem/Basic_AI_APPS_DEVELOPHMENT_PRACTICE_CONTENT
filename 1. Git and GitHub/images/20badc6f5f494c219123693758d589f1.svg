<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" width="940" height="430" role="img" aria-label="One project in two copies. On the left, your computer holds the working tree you edit, the staging area that git add fills, and the local repository that git commit writes to. On the right, GitHub holds the remote repository everyone shares, and origin is the name your repository gives that URL. A green arrow labelled git push runs from the local repository to the remote one. A blue arrow labelled git fetch and git pull runs back the other way. Adding a remote only stores the name; nothing travels until you push or fetch."><title>One project in two copies. On the left, your computer holds the working tree you edit, the staging area that git add fills, and the local repository that git commit writes to. On the right, GitHub holds the remote repository everyone shares, and origin is the name your repository gives that URL. A green arrow labelled git push runs from the local repository to the remote one. A blue arrow labelled git fetch and git pull runs back the other way. Adding a remote only stores the name; nothing travels until you push or fetch.</title><defs><marker id="ah2e9e5b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e9e5b"/></marker><marker id="ah2e9e5b-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e9e5b"/></marker><marker id="ah333333" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ah333333-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#333333"/></marker><marker id="ah3a6fd8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a6fd8"/></marker><marker id="ah3a6fd8-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3a6fd8"/></marker></defs><rect x="0" y="0" width="940" height="430" fill="#ffffff"/><text x="470" y="28" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="17" fill="#333333" font-weight="bold">One project, two copies</text><rect x="30" y="50" width="380" height="330" rx="10" fill="#fbfbfe" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="5 4"/><text x="220" y="74" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="15" fill="#555555" font-weight="bold">Your computer</text><rect x="70" y="84" width="300" height="56" rx="6" fill="#ECECFF" stroke="#9370DB" stroke-width="1.2"/><text x="220" y="108.5" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="14" fill="#333333">Working tree</text><text x="220" y="125.3" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="14" fill="#333333">the files you edit</text><rect x="70" y="176" width="300" height="56" rx="6" fill="#ECECFF" stroke="#9370DB" stroke-width="1.2"/><text x="220" y="200.5" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="14" fill="#333333">Staging area</text><text x="220" y="217.3" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="14" fill="#333333">what the next commit will hold</text><rect x="70" y="272" width="300" height="56" rx="6" fill="#e3f4ea" stroke="#2e9e5b" stroke-width="1.2"/><text x="220" y="296.5" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="14" fill="#333333">Local repository</text><text x="220" y="313.3" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="14" fill="#333333">every commit you have made</text><path d="M220,140 L220,174" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah333333)"/><text x="232" y="162" text-anchor="start" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="13" fill="#555555">git add</text><path d="M220,232 L220,270" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah333333)"/><text x="232" y="256" text-anchor="start" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="13" fill="#555555">git commit</text><rect x="530" y="50" width="380" height="330" rx="10" fill="#fbfbfe" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="5 4"/><text x="720" y="74" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="15" fill="#555555" font-weight="bold">GitHub</text><rect x="570" y="176" width="300" height="56" rx="6" fill="#e6eefc" stroke="#3a6fd8" stroke-width="1.2"/><text x="720" y="200.5" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="14" fill="#333333">Remote repository</text><text x="720" y="217.3" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="14" fill="#333333">the copy everyone shares</text><text x="720" y="266" text-anchor="middle" font-family="menlo, consolas, monospace" font-size="15" fill="#333333" font-weight="bold">origin</text><text x="720" y="290" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="13" fill="#555555">the name your repository gives</text><text x="720" y="308" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="13" fill="#555555">that URL</text><path d="M372,288 L460,288 L460,186 L568,186" fill="none" stroke="#2e9e5b" stroke-width="1.4" marker-end="url(#ah2e9e5b)"/><text x="466" y="170" text-anchor="start" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="14" fill="#2e9e5b">git push</text><path d="M568,228 L480,228 L480,320 L372,320" fill="none" stroke="#3a6fd8" stroke-width="1.4" marker-end="url(#ah3a6fd8)"/><text x="376" y="346" text-anchor="start" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="14" fill="#3a6fd8">git fetch, git pull</text><text x="470" y="404" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="13.5" fill="#555555">git remote add origin &lt;URL&gt; stores the name. Nothing travels until you push or fetch.</text></svg>