<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-label="Why a push is rejected and what a pull does about it. Commit A is followed by commit B, the last commit both sides had. The history then splits: commit C is yours on your main, and commit D is theirs, already on origin/main on GitHub. Because the history split at B, your commit cannot be added on top of theirs, so git push is answered with the rejected message main to main fetch first. A git pull, which is a git fetch followed by a git merge of origin slash main, joins C and D with the merge commit M, and the push then works."><title>Why a push is rejected and what a pull does about it. Commit A is followed by commit B, the last commit both sides had. The history then splits: commit C is yours on your main, and commit D is theirs, already on origin/main on GitHub. Because the history split at B, your commit cannot be added on top of theirs, so git push is answered with the rejected message main to main fetch first. A git pull, which is a git fetch followed by a git merge of origin slash main, joins C and D with the merge commit M, and the push then works.</title><defs><marker id="ah2e9e5b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e9e5b"/></marker><marker id="ah2e9e5b-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e9e5b"/></marker><marker id="ah333333" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ah333333-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#333333"/></marker><marker id="ahd64541" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d64541"/></marker><marker id="ahd64541-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d64541"/></marker><marker id="ahe08a1e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e08a1e"/></marker><marker id="ahe08a1e-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#e08a1e"/></marker></defs><rect x="0" y="0" width="960" height="440" fill="#ffffff"/><text x="480" y="28" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="17" fill="#333333" font-weight="bold">Why a push is rejected, and what a pull does about it</text><circle cx="140" cy="150" r="19" fill="#ECECFF" stroke="#333333" stroke-width="1.4"/><text x="140" y="156" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="15" fill="#333333">A</text><circle cx="270" cy="150" r="19" fill="#ECECFF" stroke="#333333" stroke-width="1.4"/><text x="270" y="156" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="15" fill="#333333">B</text><circle cx="430" cy="92" r="19" fill="#e3f4ea" stroke="#333333" stroke-width="1.4"/><text x="430" y="98" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="15" fill="#333333">C</text><circle cx="430" cy="212" r="19" fill="#e6eefc" stroke="#333333" stroke-width="1.4"/><text x="430" y="218" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="15" fill="#333333">D</text><circle cx="600" cy="150" r="19" fill="#fdf0dc" stroke="#333333" stroke-width="1.4"/><text x="600" y="156" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="15" fill="#333333">M</text><line x1="159" y1="150" x2="249" y2="150" stroke="#333333" stroke-width="1.3" marker-end="url(#ah333333)"/><line x1="287.9" y1="143.5" x2="410.3" y2="99.2" stroke="#333333" stroke-width="1.3" marker-end="url(#ah333333)"/><line x1="287.7" y1="156.9" x2="410.4" y2="204.4" stroke="#333333" stroke-width="1.3" marker-end="url(#ah333333)"/><line x1="448" y1="98.1" x2="580.1" y2="143.2" stroke="#e08a1e" stroke-width="1.3" marker-end="url(#ahe08a1e)"/><line x1="447.8" y1="205.5" x2="580.3" y2="157.2" stroke="#e08a1e" stroke-width="1.3" marker-end="url(#ahe08a1e)"/><text x="205" y="206" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="12.5" fill="#555555">the last commit you both had</text><text x="430" y="60" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="12.5" fill="#2e9e5b">your commit, on your main</text><text x="430" y="250" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="12.5" fill="#3a6fd8">their commit, on origin/main</text><text x="660" y="144" text-anchor="start" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="12.5" fill="#e08a1e">the merge commit</text><text x="660" y="164" text-anchor="start" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="12.5" fill="#e08a1e">that git pull adds</text><text x="24" y="292" text-anchor="start" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="13.5" fill="#d64541">The history split at B, so your commit cannot be added on top of theirs.</text><rect x="65" y="321" width="150" height="38" rx="6" fill="#ECECFF" stroke="#9370DB" stroke-width="1.2"/><text x="140" y="344.9" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="14" fill="#333333">git push</text><path d="M217,340 L268,340" fill="none" stroke="#d64541" stroke-width="1.4" marker-end="url(#ahd64541)"/><rect x="330" y="321" width="420" height="38" rx="6" fill="#fdecec" stroke="#d64541" stroke-width="1.2"/><text x="540" y="344.7" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="13.5" fill="#333333">! [rejected]  main -&gt; main (fetch first)</text><rect x="65" y="385" width="150" height="38" rx="6" fill="#ECECFF" stroke="#9370DB" stroke-width="1.2"/><text x="140" y="408.9" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="14" fill="#333333">git pull</text><path d="M217,404 L268,404" fill="none" stroke="#2e9e5b" stroke-width="1.4" marker-end="url(#ah2e9e5b)"/><rect x="330" y="385" width="360" height="38" rx="6" fill="#e3f4ea" stroke="#2e9e5b" stroke-width="1.2"/><text x="510" y="408.7" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="13.5" fill="#333333">git fetch, then git merge origin/main</text><text x="936" y="404" text-anchor="end" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="13.5" fill="#2e9e5b">then git push works</text></svg>