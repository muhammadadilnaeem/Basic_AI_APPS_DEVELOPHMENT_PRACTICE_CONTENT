<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="A pull request from branch to merged. On your computer you run git switch -c prices-fix and then git push -u origin prices-fix. On GitHub you open a pull request, it collects review and comments, and it is merged into main. After the merge the branch is deleted, and back on your computer git switch main followed by git pull brings the merged work down. The pull request is a request on GitHub, not a git command, and nothing merges until someone merges it."><title>A pull request from branch to merged. On your computer you run git switch -c prices-fix and then git push -u origin prices-fix. On GitHub you open a pull request, it collects review and comments, and it is merged into main. After the merge the branch is deleted, and back on your computer git switch main followed by git pull brings the merged work down. The pull request is a request on GitHub, not a git command, and nothing merges until someone merges it.</title><defs><marker id="ah2e9e5b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e9e5b"/></marker><marker id="ah2e9e5b-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2e9e5b"/></marker><marker id="ah333333" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ah333333-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#333333"/></marker><marker id="ah3a6fd8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a6fd8"/></marker><marker id="ah3a6fd8-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3a6fd8"/></marker></defs><rect x="0" y="0" width="960" height="330" fill="#ffffff"/><text x="480" y="28" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="17" fill="#333333" font-weight="bold">A pull request, from branch to merged</text><rect x="34" y="88" width="152" height="64" rx="6" fill="#ECECFF" stroke="#9370DB" stroke-width="1.2"/><text x="110" y="116.5" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="14" fill="#333333">git switch -c</text><text x="110" y="133.3" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="14" fill="#333333">prices-fix</text><rect x="214" y="88" width="152" height="64" rx="6" fill="#ECECFF" stroke="#9370DB" stroke-width="1.2"/><text x="290" y="116.5" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="14" fill="#333333">git push -u</text><text x="290" y="133.3" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="14" fill="#333333">origin prices-fix</text><rect x="394" y="88" width="152" height="64" rx="6" fill="#e6eefc" stroke="#3a6fd8" stroke-width="1.2"/><text x="470" y="116.5" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="14" fill="#333333">Open a pull</text><text x="470" y="133.3" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="14" fill="#333333">request</text><rect x="574" y="88" width="152" height="64" rx="6" fill="#fdf0dc" stroke="#e08a1e" stroke-width="1.2"/><text x="650" y="116.5" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="14" fill="#333333">Review and</text><text x="650" y="133.3" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="14" fill="#333333">comments</text><rect x="764" y="88" width="152" height="64" rx="6" fill="#e3f4ea" stroke="#2e9e5b" stroke-width="1.2"/><text x="840" y="116.5" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="14" fill="#333333">Merge into</text><text x="840" y="133.3" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="14" fill="#333333">main</text><path d="M188,120 L212,120" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah333333)"/><path d="M368,120 L392,120" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah333333)"/><path d="M548,120 L572,120" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah333333)"/><path d="M728,120 L762,120" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah333333)"/><text x="200" y="72" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="12.5" fill="#555555">on your computer</text><text x="650" y="72" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="12.5" fill="#555555">on GitHub</text><path d="M840,154 L840,200" fill="none" stroke="#2e9e5b" stroke-width="1.4" marker-end="url(#ah2e9e5b)"/><rect x="755" y="212" width="170" height="36" rx="6" fill="#ECECFF" stroke="#9370DB" stroke-width="1.2"/><text x="840" y="234.7" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="13.5" fill="#333333">Delete the branch</text><path d="M753,230 L349,230" fill="none" stroke="#3a6fd8" stroke-width="1.4" marker-end="url(#ah3a6fd8)"/><rect x="155" y="204" width="190" height="52" rx="6" fill="#e6eefc" stroke="#3a6fd8" stroke-width="1.2"/><text x="250" y="226.6" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="13.5" fill="#333333">git switch main</text><text x="250" y="242.8" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="13.5" fill="#333333">git pull</text><text x="480" y="306" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="13.5" fill="#555555">The pull request is a request on GitHub, not a git command. Nothing merges until someone merges it.</text></svg>