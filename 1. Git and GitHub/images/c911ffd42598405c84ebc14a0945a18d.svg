<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" width="940" height="330" role="img" aria-label="The states a file moves through in Git. A new file is untracked. git add makes it staged, and git commit makes it tracked and unchanged. Editing a tracked file makes it modified, git add stages that change, and git commit returns it to tracked and unchanged. The git status heading for each state is shown inside its box: Untracked files, Changes to be committed and Changes not staged for commit."><title>The states a file moves through in Git. A new file is untracked. git add makes it staged, and git commit makes it tracked and unchanged. Editing a tracked file makes it modified, git add stages that change, and git commit returns it to tracked and unchanged. The git status heading for each state is shown inside its box: Untracked files, Changes to be committed and Changes not staged for commit.</title><defs><marker id="ah333333" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="ah333333-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#333333"/></marker></defs><rect x="0" y="0" width="940" height="330" fill="#ffffff"/><text x="470" y="26" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="17" fill="#333333" font-weight="bold">The states of one file, and what git status calls each</text><rect x="15" y="70" width="240" height="96" rx="6" fill="#fdf0dc" stroke="#e08a1e" stroke-width="1.2"/><text x="135" y="96" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="16" fill="#333333">Untracked</text><text x="135" y="118" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="12.5" fill="#555555">Git has never seen it</text><rect x="350" y="70" width="240" height="96" rx="6" fill="#ECECFF" stroke="#9370DB" stroke-width="1.2"/><text x="470" y="96" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="16" fill="#333333">Staged</text><text x="470" y="118" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="12.5" fill="#555555">its content is in the staging area</text><rect x="685" y="70" width="240" height="96" rx="6" fill="#e3f4ea" stroke="#2e9e5b" stroke-width="1.2"/><text x="805" y="96" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="16" fill="#333333">Unchanged</text><text x="805" y="118" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="12.5" fill="#555555">the same as the last commit</text><rect x="350" y="202" width="240" height="96" rx="6" fill="#fdf0dc" stroke="#e08a1e" stroke-width="1.2"/><text x="470" y="228" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="16" fill="#333333">Modified</text><text x="470" y="250" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="12.5" fill="#555555">edited since the last commit</text><text x="135" y="154" text-anchor="middle" font-family="menlo, consolas, monospace" font-size="11" fill="#8a8a8a">status: "Untracked files"</text><text x="470" y="154" text-anchor="middle" font-family="menlo, consolas, monospace" font-size="11" fill="#8a8a8a">status: "Changes to be committed"</text><text x="805" y="154" text-anchor="middle" font-family="menlo, consolas, monospace" font-size="11" fill="#8a8a8a">status says nothing about it</text><text x="470" y="286" text-anchor="middle" font-family="menlo, consolas, monospace" font-size="11" fill="#8a8a8a">status: "Changes not staged for commit"</text><path d="M257,118 L348,118" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah333333)"/><text x="302.5" y="106" text-anchor="middle" font-family="menlo, consolas, monospace" font-size="14" fill="#555555">git add</text><path d="M592,118 L683,118" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah333333)"/><text x="637.5" y="106" text-anchor="middle" font-family="menlo, consolas, monospace" font-size="13.5" fill="#555555">git commit</text><path d="M805,168 L805,250 L592,250" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah333333)"/><text x="697.5" y="238" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="13.5" fill="#555555">you edit and save</text><path d="M470,200 L470,168" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#ah333333)"/><text x="458" y="188" text-anchor="end" font-family="menlo, consolas, monospace" font-size="14" fill="#555555">git add</text><text x="470" y="316" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="13" fill="#555555">A file you never add stays untracked, and no commit ever holds it.</text></svg>