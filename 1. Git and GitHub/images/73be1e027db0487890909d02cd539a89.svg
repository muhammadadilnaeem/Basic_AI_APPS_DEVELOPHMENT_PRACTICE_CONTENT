<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 345" width="880" height="345" role="img" aria-label="What each form of git diff compares. git diff with no arguments compares the working tree with the staging area. git diff --staged compares the staging area with the last commit. git diff HEAD compares the working tree with the last commit, so it covers both steps at once."><title>What each form of git diff compares. git diff with no arguments compares the working tree with the staging area. git diff --staged compares the staging area with the last commit. git diff HEAD compares the working tree with the last commit, so it covers both steps at once.</title><defs></defs><rect x="0" y="0" width="880" height="345" fill="#ffffff"/><text x="440" y="26" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="17" fill="#333333" font-weight="bold">What each form of git diff compares</text><rect x="20" y="65" width="220" height="70" rx="6" fill="#e3f4ea" stroke="#2e9e5b" stroke-width="1.2"/><text x="130" y="98" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="16" fill="#333333">Last commit</text><text x="130" y="118" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="12.5" fill="#555555">HEAD</text><rect x="330" y="65" width="220" height="70" rx="6" fill="#ECECFF" stroke="#9370DB" stroke-width="1.2"/><text x="440" y="98" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="16" fill="#333333">Staging area</text><text x="440" y="118" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="12.5" fill="#555555">what git add wrote</text><rect x="640" y="65" width="220" height="70" rx="6" fill="#ECECFF" stroke="#9370DB" stroke-width="1.2"/><text x="750" y="98" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="16" fill="#333333">Working tree</text><text x="750" y="118" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="12.5" fill="#555555">the files you edit</text><path d="M720,139 L720,170 L470,170 L470,139" fill="none" stroke="#333333" stroke-width="1.4"/><text x="595" y="190" text-anchor="middle" font-family="menlo, consolas, monospace" font-size="14" fill="#333333">git diff</text><path d="M410,139 L410,230 L160,230 L160,139" fill="none" stroke="#333333" stroke-width="1.4"/><text x="285" y="250" text-anchor="middle" font-family="menlo, consolas, monospace" font-size="14" fill="#333333">git diff --staged</text><path d="M780,139 L780,278 L100,278 L100,139" fill="none" stroke="#333333" stroke-width="1.4"/><text x="440" y="298" text-anchor="middle" font-family="menlo, consolas, monospace" font-size="14" fill="#333333">git diff HEAD</text><text x="440" y="332" text-anchor="middle" font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="13" fill="#555555">Each bracket covers the two sides that form of the command puts side by side.</text></svg>